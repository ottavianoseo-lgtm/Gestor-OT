services:
  db:
    image: postgis/postgis:16-3.4
    container_name: gestorot-db
    env_file:
      - .env
    ports:
      - "5433:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-postgres}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./dp_keys:/home/app/.aspnet/DataProtection-Keys
    networks:
      - ot_network

  gestor-ot-app:
    container_name: gestorot-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT}:${APP_PORT}"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - ot_network
      - web_traffic

  # MCP remoto para claude.ai (ver src/GestorOT.Mcp/README.md). Habla con la API por la red
  # interna y el reverse proxy lo alcanza como gestorot-mcp:8080 por web_traffic. No publica
  # puerto en el host: no hace falta y evita choques con lo que ya corre en el servidor.
  gestor-ot-mcp:
    container_name: gestorot-mcp
    build:
      context: .
      dockerfile: Dockerfile.mcp
    environment:
      GestorOt__BaseUrl: "http://gestor-ot-app:${APP_PORT}"
      OAuth__PublicUrl: "${MCP_PUBLIC_URL:-}"
    depends_on:
      - gestor-ot-app
    restart: always
    networks:
      - ot_network
      - web_traffic

volumes:
  postgres_data:

networks:
  ot_network:
  web_traffic:
    external: true
