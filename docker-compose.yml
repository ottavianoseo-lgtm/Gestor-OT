services:
  db:
    image: postgis/postgis:16-3.4
    container_name: gestorot-db
    env_file:
      - .env
    ports:
      - "5433:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-postgres}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./dp_keys:/home/app/.aspnet/DataProtection-Keys
    networks:
      - ot_network

  gestor-ot-app:
    container_name: gestorot-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT}:${APP_PORT}"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - ot_network
      - web_traffic

volumes:
  postgres_data:

networks:
  ot_network:
  web_traffic:
    external: true
